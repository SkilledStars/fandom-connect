name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/gateway
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: docker build -t fandom-google-ads-gateway:test .
